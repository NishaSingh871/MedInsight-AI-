name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate, install dependencies and build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          set -e
          ROOT_DIR="$(pwd)"
          echo "Starting build process from root: $ROOT_DIR"

          TARGET_FILE=""

          # 1. Check if package.json is at root
          if [ -f "package.json" ]; then
            TARGET_FILE="./package.json"
          fi

          # 2. Check anywhere in the repository
          if [ -z "$TARGET_FILE" ]; then
            TARGET_FILE=$(find . -not -path "*/.git/*" -not -path "*/node_modules/*" -name "package.json" | head -n 1)
          fi

          # 3. Check for any zip archive
          if [ -z "$TARGET_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found archive $ZIP_FILE, extracting..."
              unzip -q -o "$ZIP_FILE" -d .
              TARGET_FILE=$(find . -not -path "*/.git/*" -not -path "*/node_modules/*" -name "package.json" | head -n 1)
            fi
          fi

          if [ -z "$TARGET_FILE" ]; then
            echo "::error::Could not find package.json anywhere in the repository!"
            exit 1
          fi

          TARGET_DIR="$(dirname "$TARGET_FILE")"
          echo "Target project directory identified at: $TARGET_DIR"
          cd "$TARGET_DIR"

          echo "Installing all dependencies (including dev tools)..."
          npm install --include=dev --legacy-peer-deps

          echo "Building production bundle..."
          npm run build || npx vite build

          # Add SPA 404 fallback for GitHub Pages client-side routing
          if [ -f "dist/index.html" ]; then
            cp dist/index.html dist/404.html
          fi

          # Sync built dist to root workspace directory so upload-pages-artifact finds it
          if [ "$(pwd)" != "$ROOT_DIR" ]; then
            echo "Copying dist artifacts to root directory: $ROOT_DIR/dist"
            mkdir -p "$ROOT_DIR/dist"
            cp -r dist/* "$ROOT_DIR/dist/"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
